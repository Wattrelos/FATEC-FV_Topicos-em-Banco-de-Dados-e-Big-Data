name: Deploy Markmaps to GitHub Pages

on:
  push:
    branches:
      - main # Dispara a action sempre que houver um push na branch main
  workflow_dispatch: # Permite disparar o deploy manualmente na aba Actions do GitHub

# Permissões necessárias para fazer o deploy no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Garante que deploys simultâneos não entrem em conflito
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
      # GitHub Actions começou a descontinuar o Node.js 20 para a execução interna das Actions. actions/checkout@v4 para @v4.2.2 (ou superior): Garante que a execução interna da action use o ambiente atualizado
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        # actions/setup-node@v4 para @v4.2.0 (ou superior): Atualiza a lógica interna para evitar o aviso de depreciação do Node 20.
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 24

      - name: Create Build Directory
        run: mkdir -p dist


      - name: Compile Markmaps to HTML and Generate Portal
        run: |
          # Instala o markmap-cli globalmente
          npm install -g markmap-cli

          # Arquivo temporário para armazenar os cards HTML
          > cards.html

          # Processa exclusivamente os arquivos markdown dentro de mapas-mentais/
          find mapas-mentais/ -maxdepth 2 -type f -name "*.md" | sort | while IFS= read -r file; do
            filename=$(basename "$file" .md)
            echo "Compilando: $file -> dist/$filename.html"
            
            # Gera o HTML autônomo e offline com markmap
            markmap "$file" --no-open --offline -o "dist/$filename.html"
            
            # Extrai o título do H1 (# Título) ou usa o nome do arquivo como fallback
            title=$(grep -m 1 "^# " "$file" | sed 's/^# //' || echo "$filename")
            if [ -z "$title" ]; then
              title="$filename"
            fi
            
            # Define um badge indicativo com base no nome do arquivo
            badge="Mapa Conceitual"
            if [[ "$filename" == *"revisao"* ]]; then
              badge="Revisão & Questões"
            fi

            # Constrói o card do mapa mental
            cat <<CARD >> cards.html
            <a class='card' href='$filename.html'>
              <div class='icon-wrapper'>
                <span class='icon'>🗺️</span>
              </div>
              <div class='info'>
                <div class='card-header'>
                  <h2>$title</h2>
                  <span class='badge'>$badge</span>
                </div>
                <p class='filepath'>Origem: <code>$file</code></p>
              </div>
              <div class='arrow'>→</div>
            </a>
          CARD
          done

          # Carrega os cards gerados
          LINKS_HTML=$(cat cards.html)
          rm -f cards.html

          # Cria a página inicial dist/index.html com visual moderno e responsivo
          cat <<EOF > dist/index.html
          <!DOCTYPE html>
          <html lang="pt-BR">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Mapas Mentais - Tópicos em Banco de Dados e Big Data</title>
            <style>
              :root {
                --bg: #0b0f19;
                --card-bg: rgba(30, 41, 59, 0.7);
                --card-hover: rgba(51, 65, 85, 0.9);
                --text: #f8fafc;
                --text-muted: #94a3b8;
                --primary: #38bdf8;
                --primary-glow: rgba(56, 189, 248, 0.25);
                --border: rgba(148, 163, 184, 0.15);
                --accent: #818cf8;
              }
              * {
                box-sizing: border-box;
              }
              body {
                margin: 0;
                padding: 48px 20px;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
                background-color: var(--bg);
                background-image: 
                  radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
                  radial-gradient(at 100% 100%, rgba(129, 140, 248, 0.12) 0px, transparent 50%);
                color: var(--text);
                display: flex;
                flex-direction: column;
                align-items: center;
                min-height: 100vh;
              }
              .container {
                max-width: 820px;
                width: 100%;
              }
              header {
                text-align: center;
                margin-bottom: 44px;
              }
              .tag {
                display: inline-block;
                background: rgba(56, 189, 248, 0.1);
                color: var(--primary);
                border: 1px solid rgba(56, 189, 248, 0.3);
                padding: 4px 14px;
                border-radius: 999px;
                font-size: 0.85rem;
                font-weight: 600;
                margin-bottom: 16px;
                letter-spacing: 0.04em;
                text-transform: uppercase;
              }
              h1 {
                font-size: 2.4rem;
                margin: 0 0 12px 0;
                font-weight: 800;
                letter-spacing: -0.02em;
                background: linear-gradient(135deg, #38bdf8 20%, #818cf8 80%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
              }
              p.subtitle {
                color: var(--text-muted);
                font-size: 1.15rem;
                margin: 0 auto;
                max-width: 600px;
                line-height: 1.6;
              }
              .grid {
                display: flex;
                flex-direction: column;
                gap: 18px;
              }
              .card {
                display: flex;
                align-items: center;
                gap: 20px;
                background: var(--card-bg);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                padding: 24px 28px;
                border-radius: 16px;
                border: 1px solid var(--border);
                text-decoration: none;
                color: var(--text);
                transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
              }
              .card:hover {
                background: var(--card-hover);
                border-color: var(--primary);
                transform: translateY(-3px);
                box-shadow: 0 16px 32px -8px var(--primary-glow);
              }
              .icon-wrapper {
                background: rgba(255, 255, 255, 0.05);
                border-radius: 12px;
                width: 52px;
                height: 52px;
                display: flex;
                align-items: center;
                justify-content: center;
                flex-shrink: 0;
              }
              .icon {
                font-size: 1.8rem;
              }
              .info {
                flex: 1;
                min-width: 0;
              }
              .card-header {
                display: flex;
                align-items: center;
                gap: 12px;
                flex-wrap: wrap;
                margin-bottom: 6px;
              }
              .info h2 {
                margin: 0;
                font-size: 1.25rem;
                font-weight: 700;
                color: var(--text);
              }
              .badge {
                font-size: 0.75rem;
                font-weight: 600;
                padding: 2px 10px;
                border-radius: 999px;
                background: rgba(129, 140, 248, 0.15);
                color: var(--accent);
                border: 1px solid rgba(129, 140, 248, 0.3);
              }
              .filepath {
                margin: 0;
                font-size: 0.88rem;
                color: var(--text-muted);
              }
              code {
                background: rgba(255, 255, 255, 0.08);
                color: #e2e8f0;
                padding: 2px 8px;
                border-radius: 6px;
                font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
                font-size: 0.82rem;
              }
              .arrow {
                font-size: 1.4rem;
                color: var(--text-muted);
                transition: transform 0.2s ease, color 0.2s ease;
                padding-left: 8px;
              }
              .card:hover .arrow {
                color: var(--primary);
                transform: translateX(4px);
              }
              footer {
                margin-top: 54px;
                text-align: center;
                color: var(--text-muted);
                font-size: 0.9rem;
                border-top: 1px solid var(--border);
                padding-top: 24px;
              }
            </style>
          </head>
          <body>
            <div class="container">
              <header>
                <span class="tag">FATEC Ferraz de Vasconcelos</span>
                <h1>Tópicos em Banco de Dados & Big Data</h1>
                <p class="subtitle">Portal interativo de Mapas Mentais gerados com Markmap para revisão e fixação de conteúdo.</p>
              </header>
              <main class="grid">
                $LINKS_HTML
              </main>
              <footer>
                <p>Renderizado com <strong>Markmap-CLI</strong> & implantado automaticamente via <strong>GitHub Actions</strong></p>
              </footer>
            </div>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
